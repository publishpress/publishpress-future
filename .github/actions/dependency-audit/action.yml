name: Plugin dependency audit
description: Collect plugin dependency files and GitHub security alerts for Infra Dashboard.
inputs:
  dashboard_url:
    description: Dashboard site URL, without /wp-json.
    required: true
  entity_slug:
    description: Plugin entity slug.
    required: true
  composer_prod_dir:
    description: Optional relative directory containing the production Composer files.
    default: ''
  username:
    description: Mapped WordPress CI username.
    required: true
  app_password:
    description: WordPress Application Password.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        DASHBOARD_URL: ${{ inputs.dashboard_url }}
        ENTITY_SLUG: ${{ inputs.entity_slug }}
        COMPOSER_PROD_DIR: ${{ inputs.composer_prod_dir }}
        USERNAME: ${{ inputs.username }}
        APP_PASSWORD: ${{ inputs.app_password }}
      run: bash "$GITHUB_ACTION_PATH/audit.sh"
