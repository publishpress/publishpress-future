name: Infra audit
on:
  push:
    branches: [development]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  vulnerability-alerts: read
  security-events: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: publishpress/infra/.github/actions/dependency-audit@b73489c42e84fa948b071a443e5ea4b985a9c988
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          dashboard_url: ${{ secrets.INFRA_DASHBOARD_URL }}
          entity_slug: wp-plugin-future-free
          composer_prod_dir: lib
          username: ${{ secrets.INFRA_PLUGIN_USER }}
          app_password: ${{ secrets.INFRA_PLUGIN_PASSWORD }}
