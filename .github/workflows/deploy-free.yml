name: Deploy plugin to WordPress.org
permissions:
  contents: read
on:
  release:
    types: [ released ]

jobs:
  code-check:
    name: Check the code
    uses: ./.github/workflows/code-standards.yml
    secrets: inherit

  run-unit-tests:
    name: Run unit tests
    uses: ./.github/workflows/unit-tests.yml
    secrets: inherit

  deploy-wp-org:
    needs:
      - code-check
      - run-unit-tests
    permissions:
      contents: write
    uses: publishpress/github-workflows/.github/workflows/deploy-free.yml@v3
    with:
      stable_branch: master
    secrets: inherit
